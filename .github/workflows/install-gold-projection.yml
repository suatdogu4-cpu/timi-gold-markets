name: Install GOLD Price Projection

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check scripts (ESM + CommonJS uyumlu)
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile install_gold_projection.py
          node --check gold_projection.js
          # Repo package.json type=module: Browser dosyasi .js kalir.
          # Yalniz test icin gecici CommonJS kopyalari olusturulur.
          cp gold_projection.js gold_projection.cjs
          python - <<'PY'
          from pathlib import Path
          source = Path('test_gold_projection.js').read_text(encoding='utf-8')
          old = "require('./gold_projection.js')"
          if old not in source:
              raise SystemExit('Test importu degismis; guvenli donusum iptal edildi.')
          Path('test_gold_projection.cjs').write_text(
              source.replace(old, "require('./gold_projection.cjs')"), encoding='utf-8'
          )
          PY
          node --test test_gold_projection.cjs
          python -m unittest -v test_install_gold_projection.py
          rm -f gold_projection.cjs test_gold_projection.cjs

      - name: Install projection tab and routes
        run: |
          python install_gold_projection.py
          python -m py_compile main.py
          node --check gold_app.js

      - name: Ensure repeatable install
        run: python install_gold_projection.py

      - name: Commit main app changes
        run: |
          if [[ -n "$(git status --porcelain main.py gold_app.js)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add main.py gold_app.js
            git commit -m "Add read-only GOLD price projection tab"
            git push
          else
            echo 'Projection already installed; no changes needed.'
          fi
