name: GOLD ML V4 - Official Binance archive and compact Soloshun UI

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-binance-v4-install
  cancel-in-progress: false

jobs:
  isolated-research-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout existing GOLD SCALP PRO - NO LIVE DEPLOY
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Node for static JS verification
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Decode audit-ready Binance archive fallback and patch files
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip,pathlib
          data={
            'tools/binance_vision_archive.py': '',
            'tools/install_binance_v4.py': '',
            'test_binance_archive_v4.py': '',
          }
          for target,encoded in data.items():
              path=pathlib.Path(target)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(gzip.decompress(base64.b64decode(encoded,validate=True)))
              print('SOURCE_READY',path, path.stat().st_size)
          PY

      - name: Patch only existing ML V3 Binance fetch and existing Soloshun panel
        run: python tools/install_binance_v4.py

      - name: Verify Python safety and archive validation offline
        run: |
          python -m py_compile tools/binance_vision_archive.py tools/gold_ml_v3_pipeline.py gold_ml_v3.py main.py test_binance_archive_v4.py
          python -m unittest -v test_binance_archive_v4.py

      - name: Verify exact JavaScript syntax and retained UI methods
        run: |
          node --check gold_quant_hub.js
          grep -F 'function quantAiPanel(ai)' gold_quant_hub.js
          grep -F 'function multiModelResearchPanel(report)' gold_quant_hub.js
          grep -F "'no_trade':True" tools/gold_ml_v3_pipeline.py

      - name: Commit tested updates to a separate review branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="feature/gold-binance-v4-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add tools/binance_vision_archive.py tools/install_binance_v4.py \
             tools/gold_ml_v3_pipeline.py test_binance_archive_v4.py \
             gold_quant_hub.js gold_ml_v3.py index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Gold ML: official Binance archive fallback and concise Soloshun display'
          git push origin "HEAD:$BRANCH"
          echo "REVIEW_BRANCH=$BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "Do not merge until checks are reviewed. No live orders, no models approved automatically." >> "$GITHUB_STEP_SUMMARY"
