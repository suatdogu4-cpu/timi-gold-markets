name: Gold Graph Stability Hotfix
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Apply candle stability hotfix
      run: "python - <<'PY'\n#!/usr/bin/env python3\n\"\"\"TiMi Gold: historical-candle display + stale-signal safety hotfix.\nReads existing repo files; aborts if their expected structure changed.\nDoes not place orders or change trading strategy formulas.\n\"\"\"\nfrom pathlib import Path\n\ndef replace_one(text, old, new, label):\n    n = text.count(old)\n    if n != 1:\n        raise RuntimeError(f\"{label}: expected one match, found {n}. No changes committed.\")\n    return text.replace(old, new, 1)\n\nmain_path = Path(\"main.py\")\njs_path = Path(\"gold_app.js\")\nhtml_path = Path(\"index.legacy.html\")\nm = main_path.read_text(encoding=\"utf-8\")\njs = js_path.read_text(encoding=\"utf-8\")\nhtml = html_path.read_text(encoding=\"utf-8\")\n\nif \"window.__GOLD_BUILD__='3.2.1'\" in js:\n    print(\"Hotfix already present. No changes.\")\n    raise SystemExit(0)\n\nold_api = \"\"\"        bar_age=max(0,time.time()-bars[-1]['t']) if bars else None\n        update_limit=8 if symbol=='XAUUSDT'\
        \ and tf=='1m' else 20 if symbol=='XAUUSD' else 15\n        fresh_data=bool(bars and update_age is not None and update_age<=update_limit and\n                        bar_age is not None and bar_age<=step*2)\n        if not fresh_data:\n            raise HTTPException(503,'Güncel mum verisi doğrulanamadı; eski veri gösterilmiyor.')\n        return {'symbol':symbol,'tf':tf,'bars':bars,'source':'Bitget UTA' if symbol=='XAUUSDT' else 'OANDA v20',\n                'updated_ms':updated_ms,'age_s':update_age,'bar_age_s':bar_age,'fresh':True,\n                'closed_count':len(closed_bars(bars,tf)), 'warning':'Son mum halen oluşuyor olabilir.'}\"\"\"\nnew_api = \"\"\"        # A successful fetch is not proof that the returned market bar is current.\n        # Historical bars may be shown, but never marked as a live trading signal.\n        bar_age=(time.time()-bars[-1]['t']) if bars else None\n        update_limit=8 if symbol=='XAUUSDT' and tf=='1m' else 20 if symbol=='XAUUSD' else 15\n\
        \        fresh_data=bool(bars and update_age is not None and update_age<=update_limit and\n                        bar_age is not None and -30<=bar_age<=step*2)\n        return {'symbol':symbol,'tf':tf,'bars':bars,'source':'Bitget UTA' if symbol=='XAUUSDT' else 'OANDA v20',\n                'updated_ms':updated_ms,'age_s':update_age,'bar_age_s':bar_age,\n                'last_bar_utc':datetime.fromtimestamp(bars[-1]['t'],timezone.utc).isoformat() if bars else None,\n                'fresh':fresh_data,'status':'LIVE' if fresh_data else 'HISTORICAL',\n                'closed_count':len(closed_bars(bars,tf)),\n                'warning':'Son mum halen oluşuyor olabilir.' if fresh_data else\n                          'Mum verisi güncel değil; grafik tarihsel amaçlıdır. LONG/SHORT kullanılmamalı.'}\"\"\"\nm = replace_one(m, old_api, new_api, \"Candle API validation\")\ncompile(m, str(main_path), \"exec\")\n\njs = replace_one(\n    js, \"if(!chartDataFresh||!candleData.length){for(let p\
        \ of Object.values(plots))\",\n    \"if(!candleData.length){for(let p of Object.values(plots))\",\n    \"Retain chart bars\"\n)\njs = replace_one(\n    js, \"$('tfbar').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));markChartUnavailable('Yeni zaman dilimi için güncel mumlar yükleniyor…',true);reloadAll()\",\n    \"$('tfbar').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));markChartUnavailable('Yeni zaman dilimi için güncel mumlar yükleniyor…',true,true);reloadAll()\",\n    \"Timeframe reset\"\n)\njs = replace_one(\n    js, \"markChartUnavailable('Yeni parite için güncel mumlar yükleniyor…',true);reloadAll()\",\n    \"markChartUnavailable('Yeni parite için güncel mumlar yükleniyor…',true,true);reloadAll()\",\n    \"Symbol reset\"\n)\njs = replace_one(\n    js, \"function tickPlot(price,ms){if(!price||symbol!=='XAUUSDT'||!candleData.length)return;\",\n    \"function tickPlot(price,ms){if(!chartDataFresh||!price||symbol!=='XAUUSDT'||!candleData.length)return;\"\
        ,\n    \"Block live ticks on historical chart\"\n)\ni = js.index(\"function markChartUnavailable(\")\nj = js.index(\"async function refreshCandles()\", i)\nnew_functions = \"\"\"function markChartUnavailable(message,force=false,reset=false){\n if(!force&&chartDataFresh&&Date.now()-candleUpdatedMs<=candleMaxAgeMs()){\n  $('chartUpdated').textContent='Mum yenilemesi bekleniyor · mevcut doğrulanmış veri korunuyor';return false;\n }\n chartDataFresh=false;\n if(reset){candleData=[];candleUpdatedMs=0;}\n clearCurrentAnalysis();\n window.unifiedDecisionResult=null;\n updateUnifiedChartZones(null);\n renderPlots();\n const last=candleData.length?candleData[candleData.length-1]:null;\n $('chartUpdated').textContent=(last?'GECİKMELİ · son mum '+date(last.t)+' · ':'VERİ YOK · ')+(message||'Yeni mum bekleniyor');\n if($('uxFeedStatus'))$('uxFeedStatus').textContent='GECİKMELİ · KARAR BEKLE';\n return true;\n}\nfunction acceptCandleResponse(c){\n if(!Array.isArray(c?.bars)||!c.bars.length)throw\
        \ Error('Mum verisi bulunamadı');\n const bars=c.bars,last=bars[bars.length-1],lastTime=Number(last.t);\n const step=({'1m':60,'3m':180,'5m':300,'15m':900,'30m':1800,'1H':3600,'4H':14400,'1D':86400})[tf]||60;\n const actualAge=Date.now()/1000-lastTime;\n const verified=c.fresh===true&&Number.isFinite(actualAge)&&actualAge>=-30&&actualAge<=step*2+15;\n if(!verified){\n  const previousTime=Number(candleData[candleData.length-1]?.t)||0;\n  if(previousTime>lastTime){\n   markChartUnavailable('Kaynak daha eski mum gönderdi; son doğrulanmış grafik korundu',true);\n   return;\n  }\n }\n candleData=bars;\n if(!verified){\n  chartDataFresh=false;candleUpdatedMs=0;\n  clearCurrentAnalysis();window.unifiedDecisionResult=null;updateUnifiedChartZones(null);\n  renderPlots();\n  $('chartUpdated').textContent='TARİHSEL GRAFİK · son mum '+date(lastTime)+' · sinyaller kapalı';\n  if($('uxFeedStatus'))$('uxFeedStatus').textContent='GECİKMELİ · KARAR BEKLE';\n  return;\n }\n candleUpdatedMs=Date.now();chartDataFresh=true;\n\
        \ $('chartUpdated').textContent='Mum verisi · '+age(c.age_s)+' önce';\n if($('uxFeedStatus'))$('uxFeedStatus').textContent='MUM GÜNCEL · '+age(c.age_s);\n renderPlots();\n}\n\"\"\"\njs = js[:i] + new_functions + js[j:]\njs = replace_one(\n    js, \"function uxSetTf(v){if(!tfs.includes(v))return;tf=v;\",\n    \"function uxSetTf(v){if(!tfs.includes(v))return;tf=v;markChartUnavailable('Yeni zaman dilimi yükleniyor…',true,true);\",\n    \"Mobile timeframe reset\"\n)\njs = replace_one(\n    js, \"if(status)status.textContent=snap?.valid?.ticker?(snap?.ws_connected?'CANLI':'GECİKMELİ'):'VERİ EKSİK'\",\n    \"if(status)status.textContent=!chartDataFresh?'GECİKMELİ · KARAR BEKLE':snap?.valid?.ticker?(snap?.ws_connected?'CANLI':'GECİKMELİ'):'VERİ EKSİK'\",\n    \"Feed status\"\n)\njs = replace_one(\n    js, \"window.__GOLD_BUILD__='3.2.0'\",\n    \"window.__GOLD_BUILD__='3.2.1'\",\n    \"Build version\"\n)\nhtml = replace_one(\n    html, '<script defer src=\"gold_app.js?v=3308\"></script>',\n\
        \    '<script defer src=\"gold_app.js?v=3309\"></script>',\n    \"Browser cache bust\"\n)\n\n# All transformations must finish and Python must parse before writing any file.\nmain_path.write_text(m, encoding=\"utf-8\")\njs_path.write_text(js, encoding=\"utf-8\")\nhtml_path.write_text(html, encoding=\"utf-8\")\nprint(\"Three files patched. No real-order code added.\")\n\nPY"
    - name: Syntax and whitespace checks
      run: 'python -m py_compile main.py

        node --check gold_app.js

        git diff --check'
    - name: Commit the validated changes
      run: "git config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add main.py gold_app.js index.legacy.html\nif ! git diff --cached --quiet; then\n  git commit -m \"fix: preserve gold chart on stale candles; disable signals\"\n  git push\nelse\n  echo \"Already updated; nothing to commit.\"\nfi"
