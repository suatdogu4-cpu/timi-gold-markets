name: GOLD SCALP V6 - Install minute research engine
"on":
  workflow_dispatch:
permissions:
  contents: write
jobs:
  isolated-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout existing GOLD SCALP PRO main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make separate code review branch, never deploy before merge
        shell: bash
        run: |
          set -euo pipefail
          git checkout -b feature/gold-scalp-v6-${{ github.run_id }}
      - name: Install dependency libraries for offline tests in GitHub only
        run: python -m pip install 'numpy>=2.1,<3' 'pandas>=2.2,<3'
