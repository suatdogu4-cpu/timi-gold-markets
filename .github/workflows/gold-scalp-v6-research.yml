name: GOLD SCALP V6 - Minute Historical Research

# Cost- and time-aware research only. No broker keys or order placement.
"on":
  workflow_dispatch:
  schedule:
    - cron: '7 2 * * 1-5'

permissions:
  contents: write

concurrency:
  group: gold-v6-research
  cancel-in-progress: false

jobs:
  historical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout most recent main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GitHub-only ML dependencies (not Render)
        run: python -m pip install 'numpy>=2.1,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'xgboost>=3,<4' 'lightgbm>=4.4,<5'
      - name: Verify code syntax and no-lookahead offline tests
        run: |
          python -m py_compile gold_scalp_v6_data.py gold_scalp_v6_research.py gold_scalp_v6_view.py
          python -m unittest -v test_gold_scalp_v6.py
      - name: Fetch independent verified closed XAUUSDT 1m history
        run: python gold_scalp_v6_data.py collect --pages 480 --days 60
      - name: Train independent 1m/3m/5m/15m strategy and ML comparisons
        run: python gold_scalp_v6_research.py
      - name: Upload diagnostics even if research fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-scalp-v6-diagnostics
          path: |
            models/gold_scalp_v6_research.json
            datasets/gold_scalp_v6/manifest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit independently sourced 1m history and read-only ML report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datasets/gold_scalp_v6/ models/gold_scalp_v6_research.json
          if git diff --cached --quiet; then
            echo 'No new verified minute data or ML report'
            exit 0
          fi
          git commit -m 'GOLD V6: verified 1m archive and offline research [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'Only retrospective research published. No live trading or approved signal.' >> "$GITHUB_STEP_SUMMARY"
