name: GOLD SHADOW V5 - Install into existing Soloshun panel
"on":
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gold-shadow-v5-installer
  cancel-in-progress: false
jobs:
  install-research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout existing GOLD SCALP PRO (do not deploy directly)
        uses: actions/checkout@v4
      - name: Python 3.12 for source safety tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node 22 for UI verification
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode reviewed V5 research-only source files
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64,gzip,pathlib
          assets={
            'gold_shadow_v5.py': '',
            'test_gold_shadow_v5.py': '',
            'install_shadow_v5.py': '',
          }
          for name,packed in assets.items():
              path=pathlib.Path(name)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(gzip.decompress(base64.b64decode(packed,validate=True)))
              print('SOURCE_READY',path,path.stat().st_size)
          PYCODE
      - name: Patch existing backend and Soloshun panel with anchored research-only UI
        run: python install_shadow_v5.py
      - name: Validate Python and independent prospective journal rules
        run: |
          python -m py_compile gold_shadow_v5.py gold_ml_v3.py main.py test_gold_shadow_v5.py
          python -m unittest -v test_gold_shadow_v5.py
      - name: Validate actual JavaScript after patch
        run: |
          node --check gold_quant_hub.js
          grep -F 'function shadowV5Panel(s)' gold_quant_hub.js
          grep -F 'shadow_v5' main.py
          grep -F 'gold_quant_hub.js?v=3600' index.html
      - name: Commit to a new isolated branch for review
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="feature/gold-shadow-v5-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git add gold_shadow_v5.py test_gold_shadow_v5.py install_shadow_v5.py \
            gold_quant_hub.js main.py index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Gold Shadow V5: independent prospective journal and read-only Soloshun UI'
          git push origin "HEAD:$BRANCH"
          echo "REVIEW_BRANCH=$BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo 'Create PR and review; do not enable live orders or consensus voting.' >> "$GITHUB_STEP_SUMMARY"
