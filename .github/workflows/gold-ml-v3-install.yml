name: GOLD ML V3 - Install in existing Soloshun research panel

# Only creates review branch; no main updates, no Render redeploy, no trading.
"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research-only-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current GOLD SCALP PRO
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Decode source-isolated 26-feature multi-model research module
        shell: bash
        run: |
          python - <<'PYGOLDML'
          import base64, gzip
          from pathlib import Path
          payloads={
          'gold_ml_v3.py': '',
          'tools/gold_ml_v3_pipeline.py': '',
          'test_gold_ml_v3.py': '',
          'tools/install_gold_ml_v3.py': '',
          }
          for filename,compressed in payloads.items():
              dest=Path(filename)
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(gzip.decompress(base64.b64decode(compressed)))
          print('ML v3 sources decoded:',', '.join(payloads))
          PYGOLDML
      - name: Patch only Soloshun card and read-only server response
        run: python tools/install_gold_ml_v3.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research testing dependencies (not on Render)
        run: python -m pip install 'numpy>=2.1,<3' 'xgboost>=3.0,<4' 'lightgbm>=4.4,<5' 'scikit-learn>=1.5,<2'
      - name: Validate Python, JavaScript and research safeguards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile gold_ml_v3.py tools/gold_ml_v3_pipeline.py tools/install_gold_ml_v3.py main.py
          python -m unittest -v test_gold_ml_v3.py test_gold_ml.py test_gold_session_ai.py
          node --check gold_quant_hub.js
      - name: Commit to new review branch (never modify daily workflow)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BRANCH="feature/gold-ml-v3-${{ github.run_number }}"
          git switch -c "$BRANCH"
          git add main.py index.html gold_quant_hub.js gold_ml_v3.py tools/gold_ml_v3_pipeline.py test_gold_ml_v3.py tools/install_gold_ml_v3.py
          if git diff --cached --quiet; then echo 'No changes'; exit 1; fi
          git commit -m 'Gold ML v3 26-features, 3-model research, Binance history and durable OHLC archives'
          git push -u origin "$BRANCH"
          echo "Review branch: $BRANCH"
