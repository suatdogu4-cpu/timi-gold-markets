name: GOLD ML - Install in existing Soloshun panel

# Manual installer: creates a review branch, DOES NOT deploy to Render/main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  safe-gold-ml:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout GOLD SCALP PRO
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Decode independently tested installer and ML sources
        shell: bash
        run: |
          python - <<'PYSTAGE'
          import base64, gzip
          from pathlib import Path
          payloads = {
              'gold_ml_core.py': '',
              'test_gold_ml.py': '',
              'tools/gold_ml_pipeline.py': '',
              'tools/install_gold_ml.py': '',
              '.github/workflows/gold-ml-daily.yml': '',
          }
          for filename, compressed in payloads.items():
              dest=Path('.stage')/filename
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(gzip.decompress(base64.b64decode(compressed)))
          print('Installer and ML sources decoded')
          PYSTAGE
      - name: Patch existing Soloshun pane only
        run: python .stage/tools/install_gold_ml.py
      - name: Set up Python 3.12 for repeatable ML tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install XGBoost NumPy and scikit-learn for GitHub test runner only
        shell: bash
        run: python -m pip install 'numpy>=2.1,<3' 'xgboost>=3.0,<4' 'scikit-learn>=1.5,<2'
      - name: Compile Python and JS + synthetic model validation tests
        shell: bash
        run: |
          python -m py_compile main.py gold_ml_core.py test_gold_ml.py tools/gold_ml_pipeline.py
          python -m unittest -v test_gold_ml.py test_gold_session_ai.py
          node --check gold_quant_hub.js
      - name: Create a review branch, do not alter current Render deployment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BRANCH="feature/gold-ml-v1-${{ github.run_number }}"
          git switch -c "$BRANCH"
          git add main.py index.html gold_quant_hub.js gold_ml_core.py test_gold_ml.py tools/gold_ml_pipeline.py
          git diff --cached --quiet && { echo 'No changes found'; exit 1; }
          git commit -m 'Gold ML: source-separated H1 history, verified XGBoost, existing Soloshun panel'
          git push -u origin "$BRANCH"
          echo "Review this branch before merging: $BRANCH"
