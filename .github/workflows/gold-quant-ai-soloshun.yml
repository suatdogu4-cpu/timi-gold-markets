name: GOLD QUANT AI - Soloshun existing panel

# Only runs if the user presses Run workflow; does not auto-edit main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  safe-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out existing GOLD SCALP PRO
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare audited QUANT AI module and installer
        shell: bash
        run: |
          python - <<'PYGOLD'
          import base64, pathlib
          root = pathlib.Path.cwd()
          payloads = {
              'source/gold_session_ai.py': '',
              'source/test_gold_session_ai.py': '',
              'tools/install_quant_ai.py': '',
          }
          for name, body in payloads.items():
              p=root/name
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(body))
          print('3 kaynak dosyası hazır')
          PYGOLD
      - name: Patch only Soloshun pane, no new tab
        shell: bash
        run: |
          python tools/install_quant_ai.py
      - name: Verify Python and JavaScript before committing
        shell: bash
        run: |
          python -m py_compile main.py gold_quant_hub.py gold_session_ai.py test_gold_session_ai.py
          python -m unittest -v test_gold_session_ai.py
          node --check gold_quant_hub.js
      - name: Create separate review branch (no Render deploy yet)
        shell: bash
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="feature/quant-ai-soloshun-${{ github.run_number }}"
          git switch -c "$BRANCH"
          git add main.py index.html gold_quant_hub.js gold_session_ai.py test_gold_session_ai.py
          git commit -m "Add audited QUANT AI data panel inside existing Soloshun Quant Hub tab"
          git push -u origin "$BRANCH"
          echo "Review branch: $BRANCH"
